name: Release

on:
  push:
    branches:
      - main

env:
  # ── Monorepo ──────────────────────────────────────────────────────────────
  PROJECT_WORKING_DIRECTORY: cosmotech-viz-plugins

  # ── Apache Superset ───────────────────────────────────────────────────────
  SUPERSET_VERSION: '6.0.0'
  SUPERSET_REPO: apache/superset

  # ── Plugin injection ──────────────────────────────────────────────────────
  PRESET_NAME: CosmoTech
  PLUGINS_EXTRA_FILENAME: setupPluginsExtra.ts

  # ── Docker image (published to GitHub Container Registry) ─────────────────
  IMAGE_NAME: cosmotech-superset
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Publish each plugin to npm (parallel matrix) ─────────────────────
  publish:
    name: Publish @cosmotech/plugin-${{ matrix.plugin }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        # ── Add new plugin folder names here after running `yarn plugin:init` ──
        plugin:
          - hello-world
          - organizational-chart

    steps:
      # ── 1. Checkout this monorepo ────────────────────────────────────────────
      - name: Checkout cosmotech-viz-plugins
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
          scope: '@cosmotech'

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ── 4. Build the plugin ──────────────────────────────────────────────────
      - name: Build plugin
        run: yarn workspace @cosmotech/plugin-${{ matrix.plugin }} build

      # ── 5. Check if version already exists on npm ──────────────────────────
      - name: Check if version is already published
        id: check-version
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${PKG_VERSION} already exists on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 6. Determine npm dist-tag from version ──────────────────────────────
      - name: Determine npm dist-tag
        id: dist-tag
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Extract pre-release identifier (e.g. 1.0.0-beta.1 → beta)
          PRERELEASE=$(echo "$PKG_VERSION" | sed -n 's/^[0-9]*\.[0-9]*\.[0-9]*-\([a-zA-Z]*\).*/\1/p')
          if [ -n "$PRERELEASE" ]; then
            echo "tag=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Ensure npm 11.5.1 or later for trusted publishing
      - run: npm install -g npm@latest
      
      # ── 7. Publish to npm ────────────────────────────────────────────────────
      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Publishing ${PKG_NAME}@${PKG_VERSION} with dist-tag '${{ steps.dist-tag.outputs.tag }}'..."
          yarn version --new-version $PKG_VERSION --no-git-tag-version
          yarn install --frozen-lockfile
          npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

  # ── Job 2: Inject plugins into Superset and push Docker image ───────────────
  release:
    name: Inject plugins into Superset and push Docker image
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout this monorepo ────────────────────────────────────────────
      - name: Checkout cosmotech-viz-plugins
        uses: actions/checkout@v4

      # ── 2. Checkout apache/superset at the pinned version ────────────────────
      - name: Checkout apache/superset ${{ env.SUPERSET_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUPERSET_REPO }}
          ref: ${{ env.SUPERSET_VERSION }}
          fetch-tags: true
          path: superset

      # ── 3. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # ── 4. Install monorepo dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ── 5. Inject plugins into the Superset frontend ─────────────────────────
      - name: Prepare Superset build
        run: sh ./scripts/prepare_build.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PROJECT_WORKING_DIRECTORY: ${{ env.PROJECT_WORKING_DIRECTORY }}
          PRESET_NAME: ${{ env.PRESET_NAME }}
          PLUGINS_EXTRA_FILENAME: ${{ env.PLUGINS_EXTRA_FILENAME }}

      # ── 6. Build and push custom Superset Docker image ───────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=superset-${{ env.SUPERSET_VERSION }}
            type=sha,prefix=superset-${{ env.SUPERSET_VERSION }}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: superset
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Job 3: Scan Docker image for vulnerabilities ────────────────────────────
  scan:
    name: Scan Docker image for vulnerabilities
    runs-on: ubuntu-latest
    needs: release

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull released Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        id: scan
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Archive container image scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: container-image-scan-report
          path: 'trivy-results.sarif'
          retention-days: 3
