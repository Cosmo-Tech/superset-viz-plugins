name: Release

on:
  push:
    branches:
      - main

env:
  # ── Monorepo ──────────────────────────────────────────────────────────────
  PROJECT_WORKING_DIRECTORY: .

  # ── Apache Superset ───────────────────────────────────────────────────────
  SUPERSET_VERSION: '5.0.0'
  SUPERSET_REPO: apache/superset

  # ── Plugin injection ──────────────────────────────────────────────────────
  PRESET_NAME: CosmoTech
  PLUGINS_EXTRA_FILENAME: setupPluginsExtra.ts

  # ── Docker image (published to GitHub Container Registry) ─────────────────
  IMAGE_NAME: cosmotech-superset
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Publish each plugin to npm (parallel matrix) ─────────────────────
  publish:
    name: Publish @cosmotech/plugin-${{ matrix.plugin }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ── Add new plugin folder names here after running `yarn plugin:init` ──
        plugin:
          - hello-world

    steps:
      # ── 1. Checkout this monorepo ────────────────────────────────────────────
      - name: Checkout cosmotech-viz-plugins
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ── 4. Build the plugin ──────────────────────────────────────────────────
      - name: Build plugin
        run: yarn workspace @cosmotech/plugin-${{ matrix.plugin }} build

      # ── 5. Publish to npm ────────────────────────────────────────────────────
      - name: Publish to npm
        working-directory: plugins/${{ matrix.plugin }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Job 2: Inject plugins into Superset and push Docker image ───────────────
  release:
    name: Inject plugins into Superset and push Docker image
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout this monorepo ────────────────────────────────────────────
      - name: Checkout cosmotech-viz-plugins
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_WORKING_DIRECTORY }}

      # ── 2. Checkout apache/superset at the pinned version ────────────────────
      - name: Checkout apache/superset ${{ env.SUPERSET_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUPERSET_REPO }}
          ref: ${{ env.SUPERSET_VERSION }}
          fetch-tags: true
          path: superset

      # ── 3. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # ── 4. Install monorepo dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ── 5. Inject plugins into the Superset frontend ─────────────────────────
      - name: Prepare Superset build
        run: ./scripts/prepare_build.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PROJECT_WORKING_DIRECTORY: ${{ env.PROJECT_WORKING_DIRECTORY }}
          PRESET_NAME: ${{ env.PRESET_NAME }}
          PLUGINS_EXTRA_FILENAME: ${{ env.PLUGINS_EXTRA_FILENAME }}

      # ── 6. Build and push custom Superset Docker image ───────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=superset-${{ env.SUPERSET_VERSION }}
            type=sha,prefix=superset-${{ env.SUPERSET_VERSION }}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: superset
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
