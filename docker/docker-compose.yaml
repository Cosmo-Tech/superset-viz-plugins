services:
  superset:
    image: cosmotech/superset-dev:6.0.0
    container_name: superset_development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=change-this-in-production
      - SUPERSET_ENV=production
      - PYTHONPATH=/app/pythonpath
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./ma-base.db:/app/ma-base.db:ro   # optionnel : base SQLite locale
    networks:
      - superset-net
    command: ["bash", "-c", "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@admin.com --password admin 2>/dev/null || true && superset init && superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: superset_postgres
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=superset
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - superset-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  plugins-server:
    image: nginx:alpine
    container_name: plugins_server
    ports:
      - "80:80"
    volumes:
      - ../plugins/versions:/usr/share/nginx/html:ro # Monte les plugins buildés pour le développement local
      - ./nginx-plugins.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  superset-net:

volumes:
  postgres-data:

