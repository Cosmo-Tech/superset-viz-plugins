server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    autoindex on;

    # Ensure .js files are served with the correct MIME type
    types {
        application/javascript js mjs;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin *;
    }
}
